<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        /* div[class^='col-'] {
            border: 5px solid white;
        } */

        .verde {
            background-color: lightgreen;
            height: 120px;
            border: 5px solid white;
        }
        .verde2 {
            background-color: lightgreen;
            height: 60px;
            border: 5px solid white;
        }

        .yellow {
            background-color: hsl(62, 94%, 50%);
            height: 60px;
            border: 5px solid white;
        }

        .red {
            background-color: hsl(0, 91%, 49%);
            height: 200px;
            border: 5px solid white;
        }

        .lightblue {
            background-color: lightskyblue;
            height: 150px;
            border: 5px solid white;

        }
        .lightblue2 {
            background-color: lightskyblue;
            height: 60px;
            border: 5px solid white;

        }

        .orange {
            background-color: #FF9951;
            height: 60px;
            border: 5px solid white;
        }
        div{
            text-align: center;
            
            
        }
    </style>
</head>

<body>
    <div class="row">
        <div class="col-12 d-sm-none orange display-5">Header</div>
        <div class="d-none d-sm-block col-sm-12 d-md-none lightblue2 display-5 text-left">Header</div>
        <div class="d-none d-md-block col-md-12 verde2 display-5 text-left">Header</div>
    </div>
    <div class="row">
        <div class="col-12 col-sm-6 d-md-none red text-left display-1">1</div>
        <div class="d-none d-sm-block col-sm-6 d-md-none red text-right display-1">2</div>
        <div class="col-12 d-sm-none lightblue text-center display-1">2</div>
        <div class="col-12 d-sm-none red text-right display-1">3</div>
        <div class="d-none d-sm-block col-sm-12 d-md-none verde text-center display-1">3</div>

        <div class="d-none d-md-block col-md-4 red display-1 text-center">1</div>
        <div class="d-none d-md-block col-md-4 red display-1 text-center">2</div>
        <div class="d-none d-md-block col-md-4 red display-1 text-center">3</div>



    </div>
    <div class="row">
        <div class="col-12 col-md-6 yellow">Footer 1</div>
        <div class="col-12 col-md-6 yellow">Footer 2</div>
    </div>

   
    
</body>

</html>
