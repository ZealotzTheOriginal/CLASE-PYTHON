<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
    <title>Form Validation</title>
    <style>
        .error-message {
            color: red;
            font-size: 0.8rem;
            display: block;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="text-center">Formulario de Validaciones</h1>
        <form>
                <label for="nombre-completo" class="form-label">Nombre completo</label>
                <input type="text" id="nombre-completo" name="nombre-completo" required pattern="^[a-zA-ZáéíóúÁÉÍÓÚ\s]+$" minlength="3" class="form-control"/>
                <span class="error-message" aria-live="polite"></span>

                <label for="correo" class="form-label">Correo Electronico</label>
                <input type="text" id="correo" name="correo" required minlength="3" class="form-control"/>
                <span class="error-message" aria-live="polite"></span>

                <label for="contraseña" class="form-label">Contraseña</label>
                <input type="text" id="contraseña" name="contraseña" required minlength="8" class="form-control"/>
                <span class="error-message" aria-live="polite"></span>

                <label for="confirmar-contraseña" class="form-label">Confirmar Contraseña</label>
                <input type="text" id="confirmar-contraseña" name="confirmar-contraseña" required minlength="8" class="form-control"/>
                <span class="error-message" aria-live="polite"></span>

                <label for="nacimiento" class="form-label">Fecha de Nacimiento</label>
                <input type="text" id="nacimiento" name="nacimiento" placeholder="01/01/2025" class="form-control"/>
                <span class="error-message" aria-live="polite"></span>

                <label for="telefono" class="form-label">Teléfono</label>
                <input type="text" id="telefono" name="telefono" required class="form-control"/>
                <span class="error-message" aria-live="polite"></span>

                <label for="DNINIE" class="form-label">DNI / NIE</label>
                <input type="text" id="DNINIE" name="DNINIE" required class="form-control"/>
                <span class="error-message" aria-live="polite"></span>

                <label for="web" class="form-label">Página Web</label>
                <input type="text" id="web" name="web" required class="form-control"/>
                <span class="error-message" aria-live="polite"></span>

                <span>Aceptar los términos y condiciones</span>
                <label for="web" class="form-label"></label>
                <input type="checkbox" id="web" name="web" required/>
                <span class="error-message" aria-live="polite"></span>

                <input type="submit" id="web" name="web" required class="btn btn-dark mt-5"/>
                <span class="error-message" aria-live="polite"></span>
        </form>
    </div>
    <script src="./04TA11_Ernesto_Bless.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
