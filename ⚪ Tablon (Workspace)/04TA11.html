<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro Avanzado</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="url"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            border-color: #3498db;
            outline: none;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
        }
        .checkbox-group input {
            margin-right: 10px;
        }
        .submit-btn {
            width: 100%;
            padding: 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .submit-btn:hover {
            background-color: #2980b9;
        }
        .sub-form {
            display: none;
            padding: 15px;
            margin-top: 10px;
            background-color: #ecf0f1;
            border-radius: 5px;
        }
        .sub-form label {
            font-weight: 500;
            margin-right: 15px;
        }
        #password-confirm-error {
            color: #e74c3c;
            font-size: 0.9em;
            display: none;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h1>Formulario de Registro</h1>
        <form id="registroForm">
            <div class="form-group">
                    <label for="fullName">Nombre completo</label>
                    <input type="text" id="fullName" name="fullName" required minlength="7" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ\s]{3,}\s[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ\s]{3,}" title="Introduce al menos un nombre y un apellido (mínimo 3 letras cada uno)">
                </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required minlength="8" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[\W_]).{8,}" title="Mínimo 8 caracteres, con al menos una mayúscula, una minúscula, un número y un símbolo.">
            </div>

            <div class="form-group">
                <label for="passwordConfirm">Confirmar contraseña</label>
                <input type="password" id="passwordConfirm" name="passwordConfirm" required>
                <div id="password-confirm-error">Las contraseñas no coinciden.</div>
            </div>

            <div class="form-group">
                <label for="birthDate">Fecha de nacimiento</label>
                <input type="text" id="birthDate" name="birthDate" placeholder="dd/mm/aaaa" required>
            </div>

            <div class="form-group">
                <label for="phone">Teléfono (Opcional)</label>
                <input type="text" id="phone" name="phone" pattern="\d{9}" title="Debe contener exactamente 9 dígitos.">
            </div>
            
            <div class="form-group">
                <label for="dni">DNI / NIE</label>
                <input type="text" id="dni" name="dni" required pattern="([XYZ]?\d{7,8}-?[A-Z])|(\d{8}-?[A-Z])" title="Formato DNI (12345678Z) o NIE (X1234567Z)">
            </div>

            <div class="form-group">
                <label for="website">Página web (Opcional)</label>
                <input type="url" id="website" name="website" placeholder="https://www.ejemplo.com">
            </div>
            
            <div class="form-group">
                <label for="devType">Tipo de desarrollador</label>
                <select id="devType" name="devType">
                    <option value="">Selecciona una opción...</option>
                    <option value="backend">Backend</option>
                    <option value="frontend">Frontend</option>
                    <option value="fullstack">Fullstack</option>
                </select>
            </div>

            <div id="backend-sub" class="sub-form">
                <label>Especialidad Backend:</label>
                <input type="radio" name="backend_spec" value="python"> Python
                <input type="radio" name="backend_spec" value="php"> PHP
                <input type="radio" name="backend_spec" value="java"> Java
            </div>
            <div id="frontend-sub" class="sub-form">
                <label>Especialidad Frontend:</label>
                <input type="radio" name="frontend_spec" value="react"> ReactJS
                <input type="radio" name="frontend_spec" value="angular"> Angular
                <input type="radio" name="frontend_spec" value="vue"> Vue
            </div>
             <div id="fullstack-sub" class="sub-form">
                <p>¡Dominas ambos mundos!</p>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">Acepto los términos y condiciones</label>
            </div>

            <button type="submit" class="submit-btn">Registrarse</button>
        </form>
    </div>

<script>
    // Lógica para los subformularios dinámicos
    document.getElementById('devType').addEventListener('change', function() {
        // Ocultar todos los subformularios
        document.getElementById('backend-sub').style.display = 'none';
        document.getElementById('frontend-sub').style.display = 'none';
        document.getElementById('fullstack-sub').style.display = 'none';

        // Mostrar el subformulario correspondiente
        const selectedValue = this.value;
        if (selectedValue) {
            const subForm = document.getElementById(selectedValue + '-sub');
            if(subForm) {
                subForm.style.display = 'block';
            }
        }
    });

    // Lógica para la validación de contraseñas
    const passwordInput = document.getElementById('password');
    const passwordConfirmInput = document.getElementById('passwordConfirm');
    const errorDiv = document.getElementById('password-confirm-error');

    function validatePassword() {
        if (passwordInput.value !== passwordConfirmInput.value) {
            errorDiv.style.display = 'block';
            passwordConfirmInput.setCustomValidity("Las contraseñas no coinciden.");
        } else {
            errorDiv.style.display = 'none';
            passwordConfirmInput.setCustomValidity("");
        }
    }

    passwordInput.addEventListener('change', validatePassword);
    passwordConfirmInput.addEventListener('keyup', validatePassword);
    
    // Lógica para el envío del formulario (aquí se harían validaciones más complejas)
    document.getElementById('registroForm').addEventListener('submit', function(event) {
        event.preventDefault(); // Prevenir el envío real para este ejemplo
        
        // Validar que la fecha de nacimiento implica ser mayor de 18 (simplificado)
        const birthDateInput = document.getElementById('birthDate').value;
        // La lógica completa de fecha sería más extensa, aquí solo un placeholder
        console.log("Validando edad para: " + birthDateInput);

        alert('Formulario enviado (simulación). ¡Revisa la consola para ver los datos!');
        // Aquí iría el código para enviar los datos a un servidor.
    });

</script>

</body>
</html>
