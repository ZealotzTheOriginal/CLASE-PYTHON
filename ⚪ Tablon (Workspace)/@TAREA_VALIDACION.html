<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
    <title>Form Validation</title>
    <style>
        .error-message {
            color: red;
            font-size: 0.8rem;
            display: block; /* Para que ocupe su propia línea */
            margin-top: 5px;
        }
        .invalid{
            background-color: red;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="text-center">Formulario de Validaciones</h1>
        <form>  
                <label for="nombre-completo" class="form-label">1. Nombre completo</label>
                <input type="text" id="nombre-completo" name="nombre-completo" required pattern="^[a-zA-ZáéíóúÁÉÍÓÚ\s]+$" minlength="3" class="form-control"/>
                <span class="error-message" aria-live="polite"></span>

                <label for="correo" class="form-label">2. Correo Electronico</label>
                <input type="text" id="correo" name="correo" required minlength="3" class="form-control"/>
                <span class="error-message" aria-live="polite"></span>

                <label for="contraseña" class="form-label">3. Contraseña</label>
                <input type="text" id="contraseña" name="contraseña" required minlength="8" class="form-control"/>
                <span class="error-message" aria-live="polite"></span>

                <label for="confirmar-contraseña" class="form-label">4. Confirmar Contraseña</label>
                <input type="text" id="confirmar-contraseña" name="confirmar-contraseña" required minlength="8" class="form-control"/>
                <span class="error-message" aria-live="polite"></span>

                <label for="nacimiento" class="form-label">5. Fecha de Nacimiento</label>
                <input type="text" id="nacimiento" name="nacimiento" required class="form-control"/>
                <span class="error-message" aria-live="polite"></span>

                <label for="telefono" class="form-label">6. Teléfono</label>
                <input type="text" id="telefono" name="telefono" required class="form-control"/>
                <span class="error-message" aria-live="polite"></span>

                <label for="DNINIE" class="form-label">7. DNI / NIE</label>
                <input type="text" id="DNINIE" name="DNINIE" required class="form-control"/>
                <span class="error-message" aria-live="polite"></span>

                <label for="web" class="form-label">8. Página Web</label>
                <input type="text" id="web" name="web" required class="form-control"/>
                <span class="error-message" aria-live="polite"></span>
        </form>
    </div>
    <script src="./@TAREA_VALIDACION.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
